name: Mise à jour de la base

on:
  schedule:
    - cron: "17 4 3 * *"   # le 3 de chaque mois à 4 h 17 (UTC)
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  recalcul:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # S'arrête en erreur, sans rien publier, si une source échoue deux fois ou si des indicateurs publiés disparaissent.
      # Le détail par source est affiché dans le résumé de l'exécution (onglet Actions).
      - name: Recalcul de la base
        run: python pipeline/run_all.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Publication des données mises à jour
        run: |
          git config user.name "robot-mise-a-jour"
          git config user.email "robot-mise-a-jour@users.noreply.github.com"
          git add docs/data COLLECTE.md
          git commit -m "Mise à jour mensuelle de la base ($(date -u +%Y-%m-%d))" || { echo "Aucun changement"; exit 0; }
          git pull --rebase
          git push
